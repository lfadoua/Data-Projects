x-api-environment: &api-environment
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-job_market}
  DB_USER: ${POSTGRES_USER:-job_market}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  DB_SSLMODE: disable
  DB_SCHEMA: djmi
  DATABASE_URL: ""

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_market}
      POSTGRES_USER: ${POSTGRES_USER:-job_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  setup:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment: *api-environment
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "src.bootstrap"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment: *api-environment
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      STREAMLIT_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
