services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    env_file:
      - .env

    volumes:
      - ./data:/app/data

    ports:
      - "127.0.0.1:8002:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    environment:
      STREAMLIT_API_URL: http://api:8000

    ports:
      - "127.0.0.1:8502:8501"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
