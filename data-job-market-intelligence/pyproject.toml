[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: opt-in checks against the configured PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/components/design.py" = ["E501"]
